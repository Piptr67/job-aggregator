[project]
name = "job-aggregator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "defusedxml>=0.7.1",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "google-auth>=2.62.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "requests>=2.34.2",
    "resend>=2.50.0",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_aggregator"]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "mypy",
    "pytest",
    "ruff",
    "types-defusedxml>=0.7.0.20260504",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F"]

[tool.mypy]
python_version = "3.12"
